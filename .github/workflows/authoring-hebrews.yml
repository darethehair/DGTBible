name: Build pinned Hebrews DGT

on:
  push:
    paths:
      - '.github/workflows/authoring-hebrews.yml'
      - 'scripts/extract-stepbible-hebrews.mjs'
      - 'scripts/build-hebrews.py'
      - 'scripts/audit-hebrews.py'
      - 'scripts/epistle_common.py'
      - 'scripts/john_batch_dgt.py'
      - 'data/authoring/hebrews-*-dgt.tsv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract pinned SBLGNT and TAGNT
        run: node scripts/extract-stepbible-hebrews.mjs
      - name: Build Hebrews
        run: python scripts/preserve-certification.py python scripts/build-hebrews.py
      - name: Apply reviewed alignment quality overrides
        run: python scripts/preserve-certification.py python scripts/apply-quality-overrides.py
      - name: Audit Hebrews
        run: python scripts/audit-hebrews.py
      - name: Commit clean generated Hebrews
        run: |
          git config user.name "DGTBible authoring bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hebrews/*.json data/sources/step-hebrews-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate QA-clean Hebrews"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 2
            done
          fi
