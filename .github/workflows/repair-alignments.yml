name: Repair corpus alignments
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/repair-alignments.py'
      - 'scripts/alignment_repair.py'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair semantic alignments
        run: python scripts/repair-alignments.py
      - name: Apply reviewed alignment quality overrides
        run: python scripts/apply-quality-overrides.py
      - name: Re-audit semantic alignments
        run: python scripts/audit-alignment-quality.py
      - name: Commit repaired alignments
        run: |
          git config user.name "DGTBible alignment bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/john/*.json data/1john/*.json data/2john/*.json data/3john/*.json data/jude/*.json data/1peter/*.json data/2peter/*.json data/james/*.json data/hebrews/*.json data/romans/*.json
          if ! git diff --cached --quiet; then
            git commit -m "Repair context-aware alignments across completed books"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 2
            done
          fi
