name: Extract pinned STEPBible John range

on:
  push:
    paths:
      - '.github/workflows/authoring-stepbible.yml'
      - 'scripts/extract-stepbible-john.mjs'
      - 'scripts/preflight-john-batch.mjs'
      - 'scripts/build-john-batch.py'
      - 'scripts/john_batch_common.py'
      - 'scripts/john_batch_dgt.py'
      - 'scripts/audit-john-batch.py'
      - 'data/authoring/john-*-dgt.tsv'
  workflow_dispatch:
    inputs:
      start_chapter:
        description: 'First John chapter'
        required: true
        default: '11'
      end_chapter:
        description: 'Last John chapter'
        required: true
        default: '21'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      START_CHAPTER: ${{ github.event.inputs.start_chapter || '11' }}
      END_CHAPTER: ${{ github.event.inputs.end_chapter || '21' }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract pinned TAGNT range
        run: node scripts/extract-stepbible-john.mjs
      - name: Preflight SBLGNT against TAGNT
        run: node scripts/preflight-john-batch.mjs
      - name: Build generated John range
        run: python scripts/build-john-batch.py
      - name: Apply reviewed alignment quality overrides
        run: python scripts/apply-quality-overrides.py
      - name: Audit generated John range
        run: python scripts/audit-john-batch.py
      - name: Commit clean generated batch
        run: |
          git config user.name "DGTBible authoring bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/john/*.json data/sources/step-john-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate QA-clean John $START_CHAPTER-$END_CHAPTER batch"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 2
            done
          fi
      - name: Upload extracted range
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stepbible-john-${{ env.START_CHAPTER }}-${{ env.END_CHAPTER }}
          path: authoring/
          if-no-files-found: error
