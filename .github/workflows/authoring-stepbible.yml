name: Extract pinned STEPBible John range

on:
  push:
    paths:
      - '.github/workflows/authoring-stepbible.yml'
      - 'scripts/extract-stepbible-john.mjs'
      - 'scripts/preflight-john-batch.mjs'
      - 'scripts/build-john-batch.py'
      - 'scripts/john_batch_common.py'
      - 'scripts/john_batch_dgt.py'
      - 'scripts/audit-john-batch.py'
      - 'data/authoring/john-*-dgt.tsv'
  workflow_dispatch:
    inputs:
      start_chapter:
        description: 'First John chapter'
        required: true
        default: '4'
      end_chapter:
        description: 'Last John chapter'
        required: true
        default: '10'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      START_CHAPTER: ${{ github.event.inputs.start_chapter || '4' }}
      END_CHAPTER: ${{ github.event.inputs.end_chapter || '10' }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract pinned TAGNT range
        run: node scripts/extract-stepbible-john.mjs
      - name: Preflight SBLGNT against TAGNT
        run: node scripts/preflight-john-batch.mjs
      - name: Build John 4-10 generated data
        if: env.START_CHAPTER == '4' && env.END_CHAPTER == '10'
        run: python scripts/build-john-batch.py
      - name: Audit generated John 4-10 batch
        if: env.START_CHAPTER == '4' && env.END_CHAPTER == '10'
        run: python scripts/audit-john-batch.py
      - name: Commit clean generated batch
        if: env.START_CHAPTER == '4' && env.END_CHAPTER == '10'
        run: |
          git config user.name "DGTBible authoring bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/john/04.json data/john/05.json data/john/06.json data/john/07.json data/john/08.json data/john/09.json data/john/10.json
          git add data/sources/step-john-04.json data/sources/step-john-05.json data/sources/step-john-06.json data/sources/step-john-07.json data/sources/step-john-08.json data/sources/step-john-09.json data/sources/step-john-10.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate QA-clean John 4-10 batch"
            git push
          fi
      - name: Upload extracted range
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stepbible-john-${{ env.START_CHAPTER }}-${{ env.END_CHAPTER }}
          path: authoring/
          if-no-files-found: error
