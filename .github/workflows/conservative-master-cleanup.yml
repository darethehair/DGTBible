name: Conservative NT master cleanup

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/run-master-cleanup.py'
      - '.github/workflows/conservative-master-cleanup.yml'
      - 'data/**/*.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: dgt-master-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Generate QA-clean') || github.event.head_commit.message == 'Refresh exact master cleanup checkpoint' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run conservative cleanup to fixed point and rescan
        run: python scripts/run-master-cleanup.py

      - name: Commit safe cleanup and persistent checkpoint
        run: |
          git config user.name "DGTBible alignment bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No conservative cleanup changes to commit."
            exit 0
          fi
          git commit -m "Apply conservative reviewed NT master alignment batch checkpoint"
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              # A concurrent book/data commit may have landed after the cleanup
              # scan. Recompute the checkpoint on the rebased tree before push.
              python scripts/master-nt-review.py
              python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('master-review/summary.json').read_text(encoding='utf8'))
          payload={
              'schema':1,
              'purpose':'Persistent checkpoint for the conservative full-NT master alignment cleanup',
              'summary':summary,
          }
          Path('data/master-review-progress.json').write_text(
              json.dumps(payload,ensure_ascii=False,indent=2)+'\\n',encoding='utf8'
          )
          PY
              git add data/master-review-progress.json
              git commit --amend --no-edit
              if git push; then exit 0; fi
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt*2))
          done

      - name: Deploy cleaned checkpoint
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Upload current ranked review queue
        uses: actions/upload-artifact@v4
        with:
          name: conservative-master-review
          path: master-review/
          retention-days: 14
