name: Build pinned Matthew DGT batch
on:
  push:
    paths:
      - 'scripts/extract-stepbible-matthew.mjs'
      - 'scripts/build-matthew.py'
      - 'scripts/audit-matthew.py'
      - 'scripts/epistle_common.py'
      - 'scripts/alignment_repair.py'
      - 'data/authoring/matthew-*-dgt.tsv'
  workflow_dispatch:
    inputs:
      start_chapter:
        required: true
        default: '1'
      end_chapter:
        required: true
        default: '28'
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      START_CHAPTER: ${{ github.event.inputs.start_chapter || '1' }}
      END_CHAPTER: ${{ github.event.inputs.end_chapter || '3' }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine authored Matthew range on push
        if: github.event_name == 'push'
        run: |
          latest=$(find data/authoring -maxdepth 1 -type f -name 'matthew-??-dgt.tsv' -printf '%f\n' | sed -E 's/^matthew-([0-9]{2})-dgt\.tsv$/\1/' | sort -n | tail -1)
          test -n "$latest"
          echo "START_CHAPTER=1" >> "$GITHUB_ENV"
          echo "END_CHAPTER=$((10#$latest))" >> "$GITHUB_ENV"
      - name: Extract pinned SBLGNT and TAGNT
        run: node scripts/extract-stepbible-matthew.mjs
      - name: Build Matthew range
        run: python scripts/preserve-certification.py python scripts/build-matthew.py
      - name: Apply reviewed alignment quality overrides
        run: python scripts/preserve-certification.py python scripts/apply-quality-overrides.py
      - name: Audit Matthew range
        run: python scripts/audit-matthew.py
      - name: Commit clean generated Matthew range
        id: publish-authoring
        run: |
          git config user.name "DGTBible authoring bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/matthew/*.json data/sources/step-matthew-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate QA-clean Matthew $START_CHAPTER-$END_CHAPTER batch"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && python scripts/preserve-certification.py --check && git push; then
                echo "pushed=true" >> "$GITHUB_OUTPUT"
                break
              fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 2
            done
          fi

      - name: Dispatch Pages deployment
        if: steps.publish-authoring.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
