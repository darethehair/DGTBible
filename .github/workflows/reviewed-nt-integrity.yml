name: Reviewed NT integrity

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify protected files and revision scope against main
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          guard="$RUNNER_TEMP/check-reviewed-baseline.py"
          git show refs/tags/v0.93-reviewed-nt:scripts/check-reviewed-baseline.py > "$guard"
          python "$guard" --root "$GITHUB_WORKSPACE" --against "$BASE" --pull-request "$PR"
