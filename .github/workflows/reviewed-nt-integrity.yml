name: Reviewed NT integrity

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify protected files and revision scope against main
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          guard="$RUNNER_TEMP/check-reviewed-baseline.py"
          tag=$(git rev-parse --verify refs/tags/v0.93-reviewed-nt)
          if [[ "$tag" != 2e85deb2b58bf6684424ac53dabe446fa2ffd2e7 ]]; then
            echo "::error::The permanent reviewed NT tag was replaced."
            exit 1
          fi
          git show "$tag:scripts/check-reviewed-baseline.py" > "$guard"
          python "$guard" --root "$GITHUB_WORKSPACE" --against "$BASE" --pull-request "$PR"
