name: Build pinned Mark DGT batch
on:
  push:
    paths:
      - 'scripts/extract-stepbible-mark.mjs'
      - 'scripts/build-mark.py'
      - 'scripts/audit-mark.py'
      - 'scripts/audit-mark-hover-breadth.py'
      - 'scripts/epistle_common.py'
      - 'scripts/alignment_repair.py'
      - 'data/authoring/mark-*-dgt.tsv'
  workflow_dispatch:
    inputs:
      start_chapter:
        required: true
        default: '1'
      end_chapter:
        required: true
        default: '16'
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      START_CHAPTER: ${{ github.event.inputs.start_chapter || '1' }}
      END_CHAPTER: ${{ github.event.inputs.end_chapter || '3' }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine authored Mark range on push
        if: github.event_name == 'push'
        run: |
          latest=$(find data/authoring -maxdepth 1 -type f -name 'mark-??-dgt.tsv' -printf '%f\n' | sed -E 's/^mark-([0-9]{2})-dgt\.tsv$/\1/' | sort -n | tail -1)
          test -n "$latest"
          echo "START_CHAPTER=1" >> "$GITHUB_ENV"
          echo "END_CHAPTER=$((10#$latest))" >> "$GITHUB_ENV"
      - name: Extract pinned SBLGNT and TAGNT
        run: node scripts/extract-stepbible-mark.mjs
      - name: Build Mark range
        run: python scripts/preserve-certification.py python scripts/build-mark.py
      - name: Apply reviewed alignment quality overrides
        run: python scripts/preserve-certification.py python scripts/apply-quality-overrides.py
      - name: Audit Mark range
        run: python scripts/audit-mark.py
      - name: Audit Mark hover breadth
        run: python scripts/audit-mark-hover-breadth.py
      - name: Commit clean generated Mark range
        run: |
          git config user.name "DGTBible authoring bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/mark/*.json data/sources/step-mark-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate QA-clean Mark $START_CHAPTER-$END_CHAPTER batch"
            # Extract/build steps may leave tracked scratch changes that are not
            # part of the generated Mark payload. Discard them before rebasing.
            git reset --hard HEAD
            for attempt in 1 2 3; do
              git pull --rebase origin main && python scripts/preserve-certification.py --check && git push && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 2
            done
          fi

      - name: Dispatch Pages deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
