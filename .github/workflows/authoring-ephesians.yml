name: Build pinned Ephesians DGT batch
on:
  push:
    paths:
      - 'scripts/extract-stepbible-ephesians.mjs'
      - 'scripts/build-ephesians.py'
      - 'scripts/audit-ephesians.py'
      - 'scripts/epistle_common.py'
      - 'scripts/alignment_repair.py'
      - 'data/authoring/ephesians-*-dgt.tsv'
  workflow_dispatch:
    inputs:
      start_chapter:
        required: true
        default: '1'
      end_chapter:
        required: true
        default: '6'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      START_CHAPTER: ${{ github.event.inputs.start_chapter || '1' }}
      END_CHAPTER: ${{ github.event.inputs.end_chapter || '6' }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract pinned SBLGNT and TAGNT
        run: node scripts/extract-stepbible-ephesians.mjs
      - name: Build Ephesians range
        run: python scripts/preserve-certification.py python scripts/build-ephesians.py
      - name: Apply reviewed alignment quality overrides
        run: python scripts/preserve-certification.py python scripts/apply-quality-overrides.py
      - name: Audit Ephesians range
        run: python scripts/audit-ephesians.py
      - name: Commit clean generated Ephesians range
        run: |
          git config user.name "DGTBible authoring bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ephesians/*.json data/sources/step-ephesians-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate QA-clean Ephesians $START_CHAPTER-$END_CHAPTER batch"
            for attempt in 1 2 3; do
              git pull --rebase origin main && python scripts/preserve-certification.py --check && git push && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 2
            done
          fi
