name: Matthew Greek coverage recovery scan
on:
  push:
    branches: [main]
    paths:
      - 'scripts/matthew-greek-recovery.py'
      - '.github/workflows/matthew-greek-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan high-confidence unused Greek mappings
        run: python scripts/matthew-greek-recovery.py
