name: Build pinned 1 Timothy DGT batch
on:
  push:
    paths:
      - 'scripts/extract-stepbible-1timothy.mjs'
      - 'scripts/build-1timothy.py'
      - 'scripts/audit-1timothy.py'
      - 'scripts/epistle_common.py'
      - 'scripts/alignment_repair.py'
      - 'data/authoring/1timothy-*-dgt.tsv'
  workflow_dispatch:
    inputs:
      start_chapter:
        required: true
        default: '1'
      end_chapter:
        required: true
        default: '6'
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      START_CHAPTER: ${{ github.event.inputs.start_chapter || '1' }}
      END_CHAPTER: ${{ github.event.inputs.end_chapter || '6' }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract pinned SBLGNT and TAGNT
        run: node scripts/extract-stepbible-1timothy.mjs
      - name: Build 1 Timothy range
        run: python scripts/preserve-certification.py python scripts/build-1timothy.py
      - name: Apply reviewed alignment quality overrides
        run: python scripts/preserve-certification.py python scripts/apply-quality-overrides.py
      - name: Audit 1 Timothy range
        run: python scripts/audit-1timothy.py
      - name: Commit clean generated 1 Timothy range
        run: |
          git config user.name "DGTBible authoring bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/1timothy/*.json data/sources/step-1timothy-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate QA-clean 1 Timothy $START_CHAPTER-$END_CHAPTER batch"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 2
            done
          fi

      - name: Dispatch Pages deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
