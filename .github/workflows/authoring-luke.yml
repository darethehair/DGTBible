name: Build pinned Luke DGT batch
on:
  push:
    paths:
      - 'scripts/extract-stepbible-luke.mjs'
      - 'scripts/build-luke.py'
      - 'scripts/audit-luke.py'
      - 'scripts/repair-luke-final.py'
      - 'scripts/audit-luke-hover-breadth.py'
      - 'scripts/epistle_common.py'
      - 'scripts/alignment_repair.py'
      - 'scripts/preserve-reviewed-alignments.py'
      - 'data/authoring/luke-*-dgt.tsv'
  workflow_dispatch:
    inputs:
      start_chapter:
        required: true
        default: '1'
      end_chapter:
        required: true
        default: '24'
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      START_CHAPTER: ${{ github.event.inputs.start_chapter || '1' }}
      END_CHAPTER: ${{ github.event.inputs.end_chapter || '3' }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine authored Luke range on push
        if: github.event_name == 'push'
        run: |
          latest=$(find data/authoring -maxdepth 1 -type f -name 'luke-??-dgt.tsv' -printf '%f\n' | sed -E 's/^luke-([0-9]{2})-dgt\.tsv$/\1/' | sort -n | tail -1)
          test -n "$latest"
          echo "START_CHAPTER=1" >> "$GITHUB_ENV"
          echo "END_CHAPTER=$((10#$latest))" >> "$GITHUB_ENV"
      - name: Snapshot reviewed Luke alignments
        run: python scripts/preserve-reviewed-alignments.py save luke /tmp/luke-reviewed.json
      - name: Extract pinned SBLGNT and TAGNT
        run: node scripts/extract-stepbible-luke.mjs
      - name: Build Luke range
        run: python scripts/preserve-certification.py python scripts/build-luke.py
      - name: Apply reviewed alignment quality overrides
        run: python scripts/preserve-certification.py python scripts/apply-quality-overrides.py
      - name: Repair deterministic Luke links after overrides
        run: python scripts/preserve-certification.py python scripts/repair-luke-final.py
      - name: Restore reviewed Luke alignments
        run: python scripts/preserve-certification.py python scripts/preserve-reviewed-alignments.py restore luke /tmp/luke-reviewed.json
      - name: Audit Luke range
        run: python scripts/audit-luke.py
      - name: Audit Luke hover breadth
        run: python scripts/audit-luke-hover-breadth.py
      - name: Commit clean generated Luke range
        run: |
          git config user.name "DGTBible authoring bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/luke/*.json data/sources/step-luke-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate QA-clean Luke $START_CHAPTER-$END_CHAPTER batch"
            # Extraction/build leaves tracked scratch files changed; keep the
            # committed generated Luke payload, discard only unstaged scratch
            # changes before rebasing against any concurrent main updates.
            git reset --hard HEAD
            for attempt in 1 2 3; do
              git pull --rebase origin main && python scripts/preserve-certification.py --check && git push && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 2
            done
          fi

      - name: Dispatch conservative master cleanup
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run conservative-master-cleanup.yml --ref main

      - name: Dispatch Pages deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
