name: Build pinned James DGT

on:
  push:
    paths:
      - '.github/workflows/authoring-james.yml'
      - 'scripts/extract-stepbible-james.mjs'
      - 'scripts/build-james.py'
      - 'scripts/audit-james.py'
      - 'scripts/epistle_common.py'
      - 'scripts/john_batch_dgt.py'
      - 'data/authoring/james-*-dgt.tsv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract pinned SBLGNT and TAGNT
        run: node scripts/extract-stepbible-james.mjs
      - name: Build James
        run: python scripts/build-james.py
      - name: Audit James
        run: python scripts/audit-james.py
      - name: Commit clean generated James
        run: |
          git config user.name "DGTBible authoring bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/james/*.json data/sources/step-james-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate QA-clean James"
            git push
          fi
