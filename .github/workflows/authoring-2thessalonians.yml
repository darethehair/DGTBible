name: Build pinned 2 Thessalonians DGT batch
on:
  push:
    paths:
      - 'scripts/extract-stepbible-2thessalonians.mjs'
      - 'scripts/build-2thessalonians.py'
      - 'scripts/audit-2thessalonians.py'
      - 'scripts/epistle_common.py'
      - 'scripts/alignment_repair.py'
      - 'data/authoring/2thessalonians-*-dgt.tsv'
  workflow_dispatch:
    inputs:
      start_chapter:
        required: true
        default: '1'
      end_chapter:
        required: true
        default: '3'
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      START_CHAPTER: ${{ github.event.inputs.start_chapter || '1' }}
      END_CHAPTER: ${{ github.event.inputs.end_chapter || '3' }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract pinned SBLGNT and TAGNT
        run: node scripts/extract-stepbible-2thessalonians.mjs
      - name: Build 2 Thessalonians range
        run: python scripts/build-2thessalonians.py
      - name: Apply reviewed alignment quality overrides
        run: python scripts/apply-quality-overrides.py
      - name: Audit 2 Thessalonians range
        run: python scripts/audit-2thessalonians.py
      - name: Commit clean generated 2 Thessalonians range
        run: |
          git config user.name "DGTBible authoring bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/2thessalonians/*.json data/sources/step-2thessalonians-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate QA-clean 2 Thessalonians $START_CHAPTER-$END_CHAPTER batch"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 2
            done
          fi

      - name: Dispatch Pages deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
