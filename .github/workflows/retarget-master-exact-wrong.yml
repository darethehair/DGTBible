# initial retarget trigger
name: Retarget master exact wrong links

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/retarget-master-exact-wrong.py'

permissions:
  contents: write

concurrency:
  group: dgt-master-cleanup
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retarget uniquely wrong exact links
        run: python scripts/preserve-certification.py python scripts/retarget-master-exact-wrong.py
      - name: Re-run full NT master review
        run: python scripts/master-nt-review.py
      - name: Commit safe exact retargeting
        run: |
          git config user.name "DGTBible alignment bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Retarget uniquely wrong exact NT alignments"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && python scripts/preserve-certification.py --check && git push; then exit 0; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep $((attempt*2))
            done
          fi
