name: Build pinned 1 John DGT batch

on:
  push:
    paths:
      - '.github/workflows/authoring-1john.yml'
      - 'scripts/extract-stepbible-1john.mjs'
      - 'scripts/epistle_common.py'
      - 'scripts/build-1john.py'
      - 'scripts/audit-1john.py'
      - 'scripts/john_batch_dgt.py'
      - 'data/authoring/1john-dgt.tsv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract pinned SBLGNT and TAGNT
        run: node scripts/extract-stepbible-1john.mjs
      - name: Build 1 John
        run: python scripts/preserve-certification.py python scripts/build-1john.py
      - name: Apply reviewed alignment quality overrides
        run: python scripts/preserve-certification.py python scripts/apply-quality-overrides.py
      - name: Audit 1 John
        run: python scripts/audit-1john.py
      - name: Commit clean generated book
        run: |
          git config user.name "DGTBible authoring bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/1john/*.json data/sources/step-1john-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate QA-clean 1 John batch"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 2
            done
          fi
      - name: Upload authoring extraction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stepbible-1john
          path: authoring/
          if-no-files-found: error
