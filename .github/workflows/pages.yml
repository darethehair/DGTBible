name: Deploy DGTBible to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair context-aware alignments for deployment
        run: python scripts/repair-alignments.py
      - name: Validate Gospel of John
        run: node scripts/validate-john.mjs
      - name: Semantic alignment audit for John
        run: node scripts/audit-alignments.mjs
      - name: Validate 1 John
        run: python scripts/audit-1john.py
      - name: Validate 2 and 3 John
        run: python scripts/audit-2-3john.py
      - name: Validate Jude
        run: python scripts/audit-jude.py
      - name: Validate 1 and 2 Peter
        run: python scripts/audit-peter.py
      - name: Validate James
        run: python scripts/audit-james.py
      - name: Validate Hebrews
        run: python scripts/audit-hebrews.py
      - name: Validate Romans
        run: python scripts/audit-romans.py
      - name: Corpus semantic alignment audit
        run: python scripts/audit-alignment-quality.py
      - name: Validate multi-book catalog
        run: |
          test -f data/books.json
          test -f data/1john/manifest.json
          test -f data/1john/editorial-notes.json
          test -f data/1john/paragraphs.json
          test -f data/2john/manifest.json
          test -f data/2john/editorial-notes.json
          test -f data/2john/paragraphs.json
          test -f data/3john/manifest.json
          test -f data/3john/editorial-notes.json
          test -f data/3john/paragraphs.json
          test -f data/jude/manifest.json
          test -f data/jude/editorial-notes.json
          test -f data/jude/paragraphs.json
          test -f data/1peter/manifest.json
          test -f data/1peter/editorial-notes.json
          test -f data/1peter/paragraphs.json
          test -f data/2peter/manifest.json
          test -f data/2peter/editorial-notes.json
          test -f data/2peter/paragraphs.json
          test -f data/james/manifest.json
          test -f data/james/editorial-notes.json
          test -f data/james/paragraphs.json
          test -f data/hebrews/manifest.json
          test -f data/hebrews/editorial-notes.json
          test -f data/hebrews/paragraphs.json
          test -f data/romans/manifest.json
          test -f data/romans/editorial-notes.json
          test -f data/romans/paragraphs.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
