name: Deploy DGTBible to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'scripts/apply-master-reviewed-batch*.py'
      - '.github/workflows/apply-master-reviewed-batch*.yml'
      - 'master-review/**'
      - 'data/master-review-progress.json'
      - 'scripts/run-master-cleanup.py'
      - '.github/workflows/conservative-master-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair context-aware alignments for deployment
        run: python scripts/preserve-certification.py python scripts/repair-alignments.py
      - name: Apply reviewed alignment quality overrides
        run: python scripts/preserve-certification.py python scripts/apply-quality-overrides.py
      - name: Repair deterministic Luke links after overrides
        run: python scripts/preserve-certification.py python scripts/repair-luke-final.py
      - name: Validate Luke
        env:
          START_CHAPTER: '1'
          END_CHAPTER: '24'
        run: python scripts/audit-luke.py
      - name: Audit Luke hover breadth
        run: python scripts/audit-luke-hover-breadth.py
      - name: Repair deterministic/reviewed Acts links after overrides
        run: python scripts/preserve-certification.py python scripts/repair-acts-final.py
      - name: Validate Acts
        env:
          START_CHAPTER: '1'
          END_CHAPTER: '28'
        run: python scripts/audit-acts.py
      - name: Produce structural Acts hover review queue
        run: python scripts/audit-acts-hover-review.py
      - name: Validate Gospel of John
        run: node scripts/validate-john.mjs
      - name: Semantic alignment audit for John
        continue-on-error: true
        run: node scripts/audit-alignments.mjs
      - name: Validate 1 John
        run: python scripts/audit-1john.py
      - name: Validate 2 and 3 John
        run: python scripts/audit-2-3john.py
      - name: Validate Jude
        run: python scripts/audit-jude.py
      - name: Validate 1 and 2 Peter
        run: python scripts/audit-peter.py
      - name: Validate James
        run: python scripts/audit-james.py
      - name: Validate Hebrews
        run: python scripts/audit-hebrews.py
      - name: Validate Romans
        run: python scripts/audit-romans.py
      - name: Validate 1 Corinthians
        run: python scripts/audit-1corinthians.py
      - name: Corpus semantic alignment audit
        continue-on-error: true
        run: python scripts/audit-alignment-quality.py
      - name: Recover clear falsely supplied Matthew articles
        run: python scripts/preserve-certification.py python scripts/audit-supplied-words.py --apply
      - name: Verify supplied article regression
        run: python scripts/audit-supplied-words.py --strict
      - name: Critical alignment sanity gate
        run: python scripts/critical-alignment-sanity.py
      - name: Audit orphan DGT content words
        continue-on-error: true
        run: python scripts/audit-orphan-content.py
      - name: Audit unused meaningful Greek source tokens
        continue-on-error: true
        run: python scripts/audit-unused-greek.py
      - name: Validate multi-book catalog
        run: |
          test -f data/books.json
          test -f data/1john/manifest.json
          test -f data/1john/editorial-notes.json
          test -f data/1john/paragraphs.json
          test -f data/2john/manifest.json
          test -f data/2john/editorial-notes.json
          test -f data/2john/paragraphs.json
          test -f data/3john/manifest.json
          test -f data/3john/editorial-notes.json
          test -f data/3john/paragraphs.json
          test -f data/jude/manifest.json
          test -f data/jude/editorial-notes.json
          test -f data/jude/paragraphs.json
          test -f data/1peter/manifest.json
          test -f data/1peter/editorial-notes.json
          test -f data/1peter/paragraphs.json
          test -f data/2peter/manifest.json
          test -f data/2peter/editorial-notes.json
          test -f data/2peter/paragraphs.json
          test -f data/james/manifest.json
          test -f data/james/editorial-notes.json
          test -f data/james/paragraphs.json
          test -f data/hebrews/manifest.json
          test -f data/hebrews/editorial-notes.json
          test -f data/hebrews/paragraphs.json
          test -f data/romans/manifest.json
          test -f data/romans/editorial-notes.json
          test -f data/romans/paragraphs.json
          test -f data/1corinthians/manifest.json
          test -f data/1corinthians/editorial-notes.json
          test -f data/1corinthians/paragraphs.json
          test -f data/luke/manifest.json
          test -f data/luke/editorial-notes.json
          test -f data/luke/paragraphs.json
          test -f data/luke/01.json
          test -f data/luke/24.json
          test -f data/acts/manifest.json
          test -f data/acts/editorial-notes.json
          test -f data/acts/paragraphs.json
          test -f data/acts/01.json
          test -f data/acts/28.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

