name: Matthew bilingual residual audit
on:
  push:
    branches: [main]
    paths:
      - 'data/matthew/**'
      - 'scripts/matthew-bilingual-residual.py'
      - '.github/workflows/matthew-bilingual-residual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Matthew bilingual residual audit
        run: python scripts/matthew-bilingual-residual.py
