name: Build pinned 2 Corinthians DGT batch
on:
  push:
    paths:
      - '.github/workflows/authoring-2corinthians.yml'
      - 'scripts/extract-stepbible-2corinthians.mjs'
      - 'scripts/build-2corinthians.py'
      - 'scripts/audit-2corinthians.py'
      - 'scripts/epistle_common.py'
      - 'scripts/alignment_repair.py'
      - 'data/authoring/2corinthians-*-dgt.tsv'
  workflow_dispatch:
    inputs:
      start_chapter:
        required: true
        default: '2'
      end_chapter:
        required: true
        default: '2'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      START_CHAPTER: ${{ github.event.inputs.start_chapter || '1' }}
      END_CHAPTER: ${{ github.event.inputs.end_chapter || '2' }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract pinned SBLGNT and TAGNT
        run: node scripts/extract-stepbible-2corinthians.mjs
      - name: Build 2 Corinthians range
        run: python scripts/build-2corinthians.py
      - name: Apply reviewed alignment quality overrides
        run: python scripts/apply-quality-overrides.py
      - name: Audit 2 Corinthians range
        run: python scripts/audit-2corinthians.py
      - name: Commit clean generated 2 Corinthians range
        run: |
          git config user.name "DGTBible authoring bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/2corinthians/*.json data/sources/step-2corinthians-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate QA-clean 2 Corinthians $START_CHAPTER-$END_CHAPTER batch"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 2
            done
          fi
