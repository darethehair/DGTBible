name: Apply thirteenth reviewed master batch
on:
  push:
    paths:
      - 'scripts/apply-master-reviewed-batch13.py'
      - '.github/workflows/apply-master-reviewed-batch13.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dgt-master-cleanup
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply-master-reviewed-batch13.py
      - run: python scripts/master-nt-review.py
      - name: Commit reviewed batch
        run: |
          git config user.name "DGTBible alignment bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Apply thirteenth reviewed NT master alignment batch"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then exit 0; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep $((attempt*2))
            done
          fi
