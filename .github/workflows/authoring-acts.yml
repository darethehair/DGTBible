name: Build pinned Acts DGT batch
on:
  push:
    paths:
      - 'scripts/extract-stepbible-acts.mjs'
      - 'scripts/build-acts.py'
      - 'scripts/audit-acts.py'
      - 'scripts/repair-acts-final.py'
      - 'scripts/apply-master-reviewed-batch26.py'
      - 'scripts/audit-acts-hover-review.py'
      - 'scripts/epistle_common.py'
      - 'scripts/alignment_repair.py'
      - 'data/authoring/acts-*-dgt.tsv'
      - '.github/workflows/authoring-acts.yml'
  workflow_dispatch:
    inputs:
      start_chapter:
        required: true
        default: '1'
      end_chapter:
        required: true
        default: '28'
permissions:
  contents: write
  actions: write
concurrency:
  group: dgt-acts-authoring
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      START_CHAPTER: ${{ github.event.inputs.start_chapter || '1' }}
      END_CHAPTER: ${{ github.event.inputs.end_chapter || '28' }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine authored Acts range on push
        if: github.event_name == 'push'
        run: |
          latest=$(find data/authoring -maxdepth 1 -type f -name 'acts-??-dgt.tsv' -printf '%f\n' | sed -E 's/^acts-([0-9]{2})-dgt\.tsv$/\1/' | sort -n | tail -1)
          test -n "$latest"
          echo "START_CHAPTER=1" >> "$GITHUB_ENV"
          echo "END_CHAPTER=$((10#$latest))" >> "$GITHUB_ENV"
      - name: Extract pinned SBLGNT and TAGNT
        run: node scripts/extract-stepbible-acts.mjs
      - name: Build Acts range
        run: python scripts/build-acts.py
      - name: Apply reviewed alignment quality overrides
        run: python scripts/apply-quality-overrides.py
      - name: Repair deterministic/reviewed Acts links after overrides
        run: python scripts/repair-acts-final.py
      - name: Reapply reviewed master narrowing corrections
        run: python scripts/apply-master-reviewed-batch26.py
      - name: Audit Acts range
        run: python scripts/audit-acts.py
      - name: Produce structural Acts hover review queue
        run: python scripts/audit-acts-hover-review.py
      - name: Commit clean generated Acts range
        run: |
          git config user.name "DGTBible authoring bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/acts/*.json data/sources/step-acts-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate QA-clean Acts $START_CHAPTER-$END_CHAPTER batch"
            git reset --hard HEAD
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 2
            done
          fi
      - name: Dispatch Pages deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
