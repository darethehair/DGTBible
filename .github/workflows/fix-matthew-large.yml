name: Apply oversized Matthew bilingual repair
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-matthew-large.py'
      - '.github/workflows/fix-matthew-large.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Matthew 13 and 26 repairs
        run: python scripts/fix-matthew-large.py
      - name: Commit repaired chapters
        run: |
          if git diff --quiet -- data/matthew/13.json data/matthew/26.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matthew/13.json data/matthew/26.json
          git commit -m "Repair oversized Matthew bilingual mappings"
          git push
