# initial cleanup trigger
name: Sanitize legacy broad hover fallbacks

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sanitize-broad-phrase-alignments.py'

permissions:
  contents: write

concurrency:
  group: dgt-master-cleanup
  cancel-in-progress: false

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only UI-suppressed whole-verse fallback spans
        run: python scripts/preserve-certification.py python scripts/sanitize-broad-phrase-alignments.py
      - name: Re-run full NT master review
        run: python scripts/master-nt-review.py
      - name: Commit deterministic cleanup
        run: |
          git config user.name "DGTBible alignment bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Remove legacy over-broad hover fallbacks"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && python scripts/preserve-certification.py --check && git push; then exit 0; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep $((attempt*2))
            done
          fi
